<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>
    <style>

        body{
            background-color: black;
        }

        h2{
            color: white;
        }

        .container-flex-row{
            border: 4px solid red;
            /* width: 250px; */
            height: 200px;

            display: flex;
            flex-direction: row ;

            /* ALIGN ITENS+ */
            justify-content: center;
            align-items: flex-start;

             
        }

        .container-flex-row > div{
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }



         .container-flex-column{
            border: 4px solid red;
            width: 250px;
            height: 600px;

            display: flex;
            flex-direction: column;

            /* ALIGN ITENS+ */
            justify-content: center;
            align-items: center;

        }

        .container-flex-column > div{
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }



        .item1, .item2, .item3{
            flex-basis: 180px;
        }

        .item1{
            flex-shrink: 0;
        }

        .item2{
            flex-shrink: 1;
        }

        .item3{
            flex-shrink: 0;
        }


    </style>
</head>
<body>
    <h1>Display Flex</h1>

    <h2>Row</h2>
    <div class="container-flex-row">
        <div class="item1">Item teste 01</div>
        <div class="item2">Item teste 02</div>
        <div class="item3">Item teste 03</div>
    </div>
    
    <h2>Column</h2>
    <div class="container-flex-column">
        <div class="item1">01</div>
        <div class="item2">02</div>
        <div class="item3">03</div>
    </div>

</body>
</html>
