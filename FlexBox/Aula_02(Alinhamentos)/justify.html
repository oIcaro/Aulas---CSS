<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>
    <style>

        body{
            background-color: black;
        }


        .container-flex{
            margin: 0 auto;
            width: 1500px;
            height: 800px;
            border: 4px solid red;
            display: flex;
            flex-direction: column;
           /* justify-content: flex-start;  - Fluxo Normal*/
           /* justify-content: flex-end;  - Fluxo Reverso*/
           /* justify-content: center; - Centralizado*/
           /* justify-content: space-around; - Distribui o espaço ao redor de cada um. O espaço nas pontas é a metade do espaço entre os blocos*/
           /* justify-content: space-between; - Espaçamento entre os elementos, colando na parede os mais próximos*/
           justify-content: flex-start; 
        }

        .container-flex > div{
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }



    </style>
</head>
<body>
    <h1>Display Flex</h1>

    <div class="container-flex">
        <div>01</div>
        <div>02</div>
<!-- 
        <div>04</div>
        <div>05</div>
        <div>06</div>
        <div>07</div>
        <div>08</div>
        <div>09</div>
        <div>10</div>
         -->
    </div>
</body>
</html>
