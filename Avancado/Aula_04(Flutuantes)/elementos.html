        body{
            border: 1px solid red;
        }

        .caixa{
            background-color: blue;
            width: 100px;
            height: 100px;
            border: 3px solid purple;
            margin: 0;

        }

        .esquerda{
            float: left;
        }

        .direita{
            float: right;
        }

        .centro{
            margin: 0 auto;
        }

        .end{
            float: inline-end;
        }

        .start{
            float: inline-start;
        }

        .none{
            float: none;
        }
